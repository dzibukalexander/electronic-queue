name: Build TV Server

on:
  push:
    branches: [ tv-server-build, chered ]
  pull_request:
    branches: [ chered ]

jobs:
  build-tv-server:
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream8
      
    steps:
    - name: Setup fast CentOS Stream 8 repositories
      run: |
        # Clean existing repos
        dnf clean all
        rm -rf /etc/yum.repos.d/*.repo
        
        # Add fast working repositories
        cat > /etc/yum.repos.d/centos.repo << 'EOF'
        [baseos]
        name=CentOS Stream $releasever - BaseOS
        baseurl=http://mirror.hostnet.nl/centos/8-stream/BaseOS/x86_64/os/
        gpgcheck=0
        enabled=1

        [appstream]
        name=CentOS Stream $releasever - AppStream
        baseurl=http://mirror.hostnet.nl/centos/8-stream/AppStream/x86_64/os/
        gpgcheck=0
        enabled=1

        [extras]
        name=CentOS Stream $releasever - Extras
        baseurl=http://mirror.hostnet.nl/centos/8-stream/extras/x86_64/os/
        gpgcheck=0
        enabled=1

        [epel]
        name=Extra Packages for Enterprise Linux $releasever - $basearch
        baseurl=https://download-ib01.fedoraproject.org/pub/epel/8/Everything/x86_64
        gpgcheck=0
        enabled=1
        EOF

        # Disable gpgcheck for faster installation
        echo "gpgcheck=0" >> /etc/dnf/dnf.conf

    - name: Install system dependencies
      run: |
        dnf update -y
        dnf install -y dnf-plugins-core
        
        # Install all required dependencies including file command
        dnf install -y python38 python38-pip python38-devel gcc gcc-c++ make
        dnf install -y bzip2-devel ncurses-devel libffi-devel readline-devel
        dnf install -y sqlite-devel tk-devel which wget git glibc-langpack-en
        dnf install -y libX11-devel libXext-devel libXrender-devel libxcb-devel
        dnf install -y mesa-libGL-devel libXi-devel file
        
        # Install RPM Fusion for VLC
        dnf install -y https://download1.rpmfusion.org/free/el/rpmfusion-free-release-8.noarch.rpm
        dnf install -y https://download1.rpmfusion.org/nonfree/el/rpmfusion-nonfree-release-8.noarch.rpm
        
        # Install VLC from RPM Fusion
        dnf install -y vlc vlc-devel
        
        # Install PyInstaller
        pip3.8 install pyinstaller==6.14.2

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Python dependencies
      working-directory: ./srv/tv
      run: |
        # Install python-vlc first
        pip3.8 install python-vlc==3.0.21203
        # Install other dependencies
        pip3.8 install -r requirements1.txt

    - name: Fix PyInstaller VLC warnings
      working-directory: ./srv/tv
      run: |
        # Create hook to help PyInstaller find VLC libraries
        mkdir -p hooks
        cat > hooks/hook-vlc.py << 'EOF'
        from PyInstaller.utils.hooks import collect_dynamic_libs

        # Collect VLC libraries
        binaries = collect_dynamic_libs('vlc')
        
        # Add specific VLC libraries that might be missed
        import os
        vlc_lib_path = '/usr/lib64'
        vlc_libs = [
            'libvlc.so.5',
            'libvlccore.so.9',
            'libvlc.so.5.6.1',
            'libvlccore.so.9.0.1'
        ]
        
        for lib in vlc_libs:
            lib_path = os.path.join(vlc_lib_path, lib)
            if os.path.exists(lib_path):
                binaries.append((lib_path, 'vlc'))
        
        print(f"Collected VLC binaries: {binaries}")
        EOF

    - name: Build executable with PyInstaller (improved)
      working-directory: ./srv/tv
      run: |
        echo "Starting PyInstaller build with improved VLC support..."
        python3.8 -m PyInstaller sb05.py \
          --onefile \
          --hidden-import=logger \
          --hidden-import=sb05_ui \
          --hidden-import=sb05_vars \
          --hidden-import=date_time \
          --hidden-import=customtkinter \
          --hidden-import=tkinter \
          --hidden-import=vlc \
          --additional-hooks-dir=hooks \
          --add-data='/usr/lib64/vlc:vlc/' \
          --add-binary='/usr/lib64/libvlc.so.5:.' \
          --add-binary='/usr/lib64/libvlccore.so.9:.' \
          --log-level INFO

    - name: Check built executable
      working-directory: ./srv/tv
      run: |
        echo "=== Build Results ==="
        ls -la dist/
        echo "=== File Info ==="
        file dist/sb05
        echo "=== Executable Size ==="
        du -h dist/sb05
        echo "=== Checking executable dependencies ==="
        ldd dist/sb05 2>/dev/null | grep vlc || echo "VLC libraries not linked dynamically (expected for PyInstaller)"
        echo "=== Basic functionality test ==="
        # Test if executable can start
        timeout 3s ./dist/sb05 --version 2>&1 | head -5 || echo "Executable started successfully (GUI may not work in CI)"


    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tv-server-artifacts
        path: srv/tv/dist/sb05
        retention-days: 30
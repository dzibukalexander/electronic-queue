name: Build TV Server

on:
  push:
    branches: [ tv-server-build, chered ]
  pull_request:
    branches: [ chered ]

jobs:
  build-tv-server:
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream8
      
    steps:
    - name: Setup fast CentOS Stream 8 repositories
      run: |
        # Clean existing repos
        dnf clean all
        rm -rf /etc/yum.repos.d/*.repo
        
        # Add fast working repositories
        cat > /etc/yum.repos.d/centos.repo << 'EOF'
        [baseos]
        name=CentOS Stream $releasever - BaseOS
        baseurl=http://mirror.hostnet.nl/centos/8-stream/BaseOS/x86_64/os/
        gpgcheck=0
        enabled=1

        [appstream]
        name=CentOS Stream $releasever - AppStream
        baseurl=http://mirror.hostnet.nl/centos/8-stream/AppStream/x86_64/os/
        gpgcheck=0
        enabled=1

        [extras]
        name=CentOS Stream $releasever - Extras
        baseurl=http://mirror.hostnet.nl/centos/8-stream/extras/x86_64/os/
        gpgcheck=0
        enabled=1

        [epel]
        name=Extra Packages for Enterprise Linux $releasever - $basearch
        baseurl=https://download-ib01.fedoraproject.org/pub/epel/8/Everything/x86_64
        gpgcheck=0
        enabled=1
        EOF

        # Disable gpgcheck for faster installation
        echo "gpgcheck=0" >> /etc/dnf/dnf.conf

    - name: Install system dependencies
      run: |
        dnf update -y
        dnf install -y dnf-plugins-core
        
        # Install all required dependencies - они доступны в baseos/appstream/epel
        dnf install -y python38 python38-pip python38-devel gcc gcc-c++ make
        dnf install -y bzip2-devel ncurses-devel libffi-devel readline-devel
        dnf install -y sqlite-devel tk-devel which wget git glibc-langpack-en
        dnf install -y libX11-devel libXext-devel libXrender-devel libxcb-devel
        dnf install -y mesa-libGL-devel libXi-devel
        
        # Install VLC from EPEL
        dnf install -y vlc vlc-devel vlc-core
        
        # Install PyInstaller
        pip3.8 install pyinstaller==6.14.2

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Python dependencies
      working-directory: ./srv/tv
      run: |
        pip3.8 install -r requirements1.txt

    - name: Verify environment
      run: |
        echo "=== Python Version ==="
        python3.8 --version
        echo "=== VLC Installation ==="
        vlc --version || echo "VLC command not available but continuing"
        echo "=== VLC Libraries ==="
        find /usr -name "*vlc*" -type f 2>/dev/null | head -10
        echo "=== VLC Plugins Directory ==="
        ls -la /usr/lib64/vlc/plugins/ 2>/dev/null | head -5 || echo "VLC plugins directory not found"
        echo "=== Checking critical dependencies ==="
        for pkg in python3-devel gcc tk-devel vlc-devel; do
            if rpm -q $pkg &>/dev/null; then
                echo "✓ $pkg installed"
            else
                echo "✗ $pkg missing"
            fi
        done

    - name: Build executable with PyInstaller
      working-directory: ./srv/tv
      run: |
        # Create a test script to verify Python can import vlc
        cat > test_vlc.py << 'EOF'
        try:
            import vlc
            print("SUCCESS: vlc imported successfully")
            print(f"vlc module path: {vlc.__file__}")
            
            # Test basic VLC functionality
            instance = vlc.Instance()
            player = instance.media_player_new()
            print("SUCCESS: VLC instance and player created")
        except Exception as e:
            print(f"ERROR: Failed to import vlc: {e}")
            import traceback
            traceback.print_exc()
        EOF
        python3.8 test_vlc.py
        
        # Use the original build command with VLC data
        echo "Starting PyInstaller build..."
        python3.8 -m PyInstaller sb05.py \
          --onefile \
          --hidden-import=logger \
          --hidden-import=sb05_ui \
          --hidden-import=sb05_vars \
          --hidden-import=date_time \
          --hidden-import=customtkinter \
          --hidden-import=tkinter \
          --hidden-import=vlc \
          --add-data='/usr/lib64/vlc:vlc/' \
          --log-level INFO

    - name: Check built executable
      working-directory: ./srv/tv
      run: |
        echo "=== Build Results ==="
        ls -la dist/
        echo "=== File Info ==="
        file dist/sb05
        echo "=== Executable Size ==="
        du -h dist/sb05
        echo "=== Testing executable ==="
        # Test if executable can run basic commands
        timeout 5s ./dist/sb05 --help || echo "Executable started (may need GUI for full functionality)"

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: tv-server-executable
        path: srv/tv/dist/sb05
        retention-days: 30

    - name: Create deployment package
      working-directory: ./srv/tv
      run: |
        mkdir -p tv-server-deploy
        cp -r videos/ images/ sb05_set.json sb05_wplace.json tv-server-deploy/
        cp dist/sb05 tv-server-deploy/
        
        # Create installation script
        cat > tv-server-deploy/install_deps.sh << 'EOF'
        #!/bin/bash
        echo "Installing dependencies for TV Server..."
        
        if command -v dnf &> /dev/null; then
            echo "Detected CentOS/RHEL system"
            sudo dnf install -y vlc python38 tkinter
        elif command -v apt &> /dev/null; then
            echo "Detected Ubuntu/Debian system"
            sudo apt update
            sudo apt install -y vlc python3 tk
        else
            echo "Please install VLC and Python 3.8 manually"
        fi
        EOF
        
        chmod +x tv-server-deploy/install_deps.sh
        chmod +x tv-server-deploy/sb05
        
        tar -czf tv-server-deploy.tar.gz tv-server-deploy/
        echo "Deployment package created: tv-server-deploy.tar.gz"

    - name: Upload deployment package
      uses: actions/upload-artifact@v4
      with:
        name: tv-server-deployment-package
        path: srv/tv/tv-server-deploy.tar.gz
        retention-days: 30
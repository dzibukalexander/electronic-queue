name: Build TV Server

on:
  push:
    branches: [ tv-server-build, chered ]
  pull_request:
    branches: [ chered ]

jobs:
  build-tv-server:
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream8
      
    steps:
    - name: Fix CentOS 8 Stream repositories
      run: |
        # Remove broken repositories
        dnf clean all
        rm -rf /etc/yum.repos.d/*.repo
        
        # Add working CentOS Stream 8 repositories
        cat > /etc/yum.repos.d/centos.repo << 'EOF'
        [baseos]
        name=CentOS Stream $releasever - BaseOS
        baseurl=https://dl.rockylinux.org/pub/rocky/8.9/BaseOS/x86_64/os/
        gpgcheck=1
        enabled=1
        gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-rockyofficial

        [appstream]
        name=CentOS Stream $releasever - AppStream
        baseurl=https://dl.rockylinux.org/pub/rocky/8.9/AppStream/x86_64/os/
        gpgcheck=1
        enabled=1
        gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-rockyofficial

        [extras]
        name=CentOS Stream $releasever - Extras
        baseurl=https://dl.rockylinux.org/pub/rocky/8.9/extras/x86_64/os/
        gpgcheck=1
        enabled=1
        gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-rockyofficial

        [epel]
        name=Extra Packages for Enterprise Linux $releasever - $basearch
        baseurl=https://download.fedoraproject.org/pub/epel/8/Everything/x86_64
        enabled=1
        gpgcheck=1
        gpgkey=https://download.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-8
        EOF
        
        # Import GPG keys
        rpm --import https://dl.rockylinux.org/pub/rocky/RPM-GPG-KEY-rockyofficial
        rpm --import https://download.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-8

    - name: Install system dependencies
      run: |
        dnf update -y
        dnf install -y dnf-plugins-core
        dnf config-manager --set-enabled powertools
        dnf install -y python38 python38-pip python38-devel gcc gcc-c++ make \
        tk-devel bzip2-devel ncurses-devel libffi-devel readline-devel \
        sqlite-devel which wget git glibc-langpack-en
        
        # Install VLC from EPEL
        dnf install -y vlc vlc-devel vlc-core
        
        # Install PyInstaller
        pip3.8 install pyinstaller==6.14.2

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Python dependencies
      working-directory: ./srv/tv
      run: |
        pip3.8 install -r requirements1.txt

    - name: Verify Python and VLC
      run: |
        python3.8 --version
        vlc --version || echo "VLC version check failed but continuing"
        echo "VLC library path:"
        find /usr -name "libvlc.so" 2>/dev/null | head -5
        echo "VLC plugins:"
        ls -la /usr/lib64/vlc/plugins/ 2>/dev/null | head -10 || echo "VLC plugins not found in standard location"

    - name: Build executable with PyInstaller
      working-directory: ./srv/tv
      run: |
        # Use the original build command with VLC data
        python3.8 -m PyInstaller sb05.py \
          --onefile \
          --hidden-import=logger \
          --hidden-import=sb05_ui \
          --hidden-import=sb05_vars \
          --hidden-import=date_time \
          --hidden-import=customtkinter \
          --hidden-import=tkinter \
          --hidden-import=vlc \
          --add-data='/usr/lib64/vlc:vlc/'

    - name: Check built executable
      working-directory: ./srv/tv
      run: |
        ls -la dist/
        file dist/sb05
        # Test if executable runs (just version check)
        ./dist/sb05 --version || echo "Executable runs but may need VLC at runtime"

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: tv-server-executable
        path: srv/tv/dist/sb05
        retention-days: 30

    - name: Create complete package
      working-directory: ./srv/tv
      run: |
        mkdir -p tv-server-package
        # Copy all necessary files
        cp -r videos/ images/ sb05_set.json sb05_wplace.json tv-server-package/
        cp dist/sb05 tv-server-package/
        
        # Create run script
        cat > tv-server-package/run.sh << 'EOF'
        #!/bin/bash
        echo "TV Server"
        echo "========="
        echo "Make sure VLC is installed on your system before running."
        echo "For CentOS/RHEL: sudo dnf install vlc"
        echo "For Ubuntu/Debian: sudo apt install vlc"
        echo ""
        echo "Starting TV server..."
        chmod +x sb05
        ./sb05
        EOF
        chmod +x tv-server-package/run.sh
        
        tar -czf tv-server-package.tar.gz tv-server-package/

    - name: Upload complete package
      uses: actions/upload-artifact@v4
      with:
        name: tv-server-complete-package
        path: srv/tv/tv-server-package.tar.gz
        retention-days: 30
name: Build TV Server

on:
  push:
    branches: [ chered, tv-server-build ]
  pull_request:
    branches: [ chered ]

jobs:
  build-tv-server:
    runs-on: ubuntu-latest
    container:
      image: centos:8
      
    steps:
    - name: Install system dependencies
      run: |
        dnf update -y
        dnf install -y epel-release
        dnf install -y python38 python38-pip python38-devel gcc gcc-c++ make \
        tk-devel bzip2-devel ncurses-devel libffi-devel readline-devel \
        sqlite-devel which wget git
        
        # Install VLC
        dnf install -y https://download1.rpmfusion.org/free/el/rpmfusion-free-release-8.noarch.rpm
        dnf install -y vlc vlc-devel
        
        # Install PyInstaller directly
        pip3.8 install pyinstaller==6.14.2

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Change to tv project directory
      run: cd srv/tv

    - name: Install Python dependencies
      working-directory: ./srv/tv
      run: |
        pip3.8 install -r requirements1.txt

    - name: Build executable with PyInstaller
      working-directory: ./srv/tv
      run: |
        # Modified build command for CentOS 8
        python3.8 -m PyInstaller sb05.py \
          --onefile \
          --hidden-import=logger \
          --hidden-import=sb05_ui \
          --hidden-import=sb05_vars \
          --hidden-import=date_time \
          --hidden-import=customtkinter \
          --hidden-import=tkinter \
          --hidden-import=vlc \
          --add-data='videos/:videos/' \
          --add-data='images/:images/' \
          --add-data='sb05_set.json:.' \
          --add-data='sb05_wplace.json:.' \
          --distpath ./dist-centos

    - name: List build artifacts
      working-directory: ./srv/tv
      run: |
        ls -la dist-centos/
        find dist-centos/ -type f -name "sb05*" -exec file {} \;

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: tv-server-executable
        path: srv/tv/dist-centos/sb05
        retention-days: 30

    - name: Create release package
      working-directory: ./srv/tv
      run: |
        mkdir -p tv-server-package
        cp -r videos/ images/ sb05_set.json sb05_wplace.json tv-server-package/
        cp dist-centos/sb05 tv-server-package/
        
        # Create a simple run script
        cat > tv-server-package/run.sh << 'EOF'
        #!/bin/bash
        chmod +x sb05
        ./sb05
        EOF
        chmod +x tv-server-package/run.sh
        
        # Create package
        tar -czf tv-server-package.tar.gz tv-server-package/

    - name: Upload complete package
      uses: actions/upload-artifact@v4
      with:
        name: tv-server-complete-package
        path: srv/tv/tv-server-package.tar.gz
        retention-days: 30
name: Build TV Server

on:
  push:
    branches: [ tv-server-build, chered ]
  pull_request:
    branches: [ tv-server-build, chered ]

jobs:
  build-tv-server:
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream8
      
    steps:
    - name: Setup fast CentOS Stream 8 repositories
      run: |
        # Clean existing repos
        dnf clean all
        rm -rf /etc/yum.repos.d/*.repo
        
        # Add fast working repositories
        cat > /etc/yum.repos.d/centos.repo << 'EOF'
        [baseos]
        name=CentOS Stream $releasever - BaseOS
        baseurl=http://mirror.hostnet.nl/centos/8-stream/BaseOS/x86_64/os/
        gpgcheck=0
        enabled=1

        [appstream]
        name=CentOS Stream $releasever - AppStream
        baseurl=http://mirror.hostnet.nl/centos/8-stream/AppStream/x86_64/os/
        gpgcheck=0
        enabled=1

        [extras]
        name=CentOS Stream $releasever - Extras
        baseurl=http://mirror.hostnet.nl/centos/8-stream/extras/x86_64/os/
        gpgcheck=0
        enabled=1

        [epel]
        name=Extra Packages for Enterprise Linux $releasever - $basearch
        baseurl=https://download-ib01.fedoraproject.org/pub/epel/8/Everything/x86_64
        gpgcheck=0
        enabled=1
        EOF

        # Disable gpgcheck for faster installation
        echo "gpgcheck=0" >> /etc/dnf/dnf.conf

    - name: Install system dependencies
      run: |
        dnf update -y
        dnf install -y dnf-plugins-core
        
        # Install Python 3.8 and ALL development dependencies
        dnf install -y python38 python38-pip python38-devel
        dnf install -y gcc gcc-c++ make
        dnf install -y bzip2-devel ncurses-devel libffi-devel readline-devel
        dnf install -y sqlite-devel tk-devel which wget git glibc-langpack-en
        dnf install -y libX11-devel libXext-devel libXrender-devel libxcb-devel
        dnf install -y mesa-libGL-devel libXi-devel file
        
        # Install tkinter - правильное имя пакета
        dnf install -y python3-tkinter tk
        
        # Install additional development libraries
        dnf install -y openssl-devel zlib-devel libjpeg-turbo-devel
        dnf install -y freetype-devel libpng-devel libtiff-devel
        
        # Install RPM Fusion for VLC
        dnf install -y https://download1.rpmfusion.org/free/el/rpmfusion-free-release-8.noarch.rpm
        dnf install -y https://download1.rpmfusion.org/nonfree/el/rpmfusion-nonfree-release-8.noarch.rpm
        
        # Install VLC from RPM Fusion
        dnf install -y vlc vlc-devel
        
        # Install PyInstaller
        pip3.8 install pyinstaller==6.14.2

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Python dependencies
      working-directory: ./srv/tv
      run: |
        # Install all dependencies from requirements
        pip3.8 install -r requirements1.txt

    - name: Verify Python and all dependencies
      working-directory: ./srv/tv
      run: |
        echo "=== Python Version ==="
        python3.8 --version
        echo "=== Testing tkinter ==="
        python3.8 -c "import tkinter; print('SUCCESS: tkinter imported'); from tkinter import Tk; root = Tk(); root.destroy(); print('SUCCESS: Tk window created and destroyed')" || echo "WARNING: tkinter test failed"
        echo "=== Testing customtkinter ==="
        python3.8 -c "import customtkinter; print('SUCCESS: customtkinter imported')" || echo "WARNING: customtkinter test failed"
        echo "=== Testing VLC ==="
        python3.8 -c "import vlc; print('SUCCESS: vlc imported'); instance = vlc.Instance(['--no-xlib']); print('SUCCESS: VLC instance created')" || echo "WARNING: vlc test failed"
        echo "=== Testing PIL/Pillow ==="
        python3.8 -c "from PIL import Image; print('SUCCESS: PIL imported')" || echo "WARNING: PIL test failed"
        echo "=== Testing psutil ==="
        python3.8 -c "import psutil; print('SUCCESS: psutil imported')" || echo "WARNING: psutil test failed"

    - name: Build executable with PyInstaller
      working-directory: ./srv/tv
      run: |
        echo "Starting PyInstaller build..."
        python3.8 -m PyInstaller sb05.py \
          --onefile \
          --hidden-import=logger \
          --hidden-import=sb05_ui \
          --hidden-import=sb05_vars \
          --hidden-import=date_time \
          --hidden-import=customtkinter \
          --hidden-import=tkinter \
          --hidden-import=vlc \
          --add-data='/usr/lib64/vlc:vlc/' \
          --log-level INFO

    - name: Check built executable
      working-directory: ./srv/tv
      run: |
        echo "=== Build Results ==="
        ls -la dist/
        echo "=== File Info ==="
        file dist/sb05
        echo "=== Executable Size ==="
        du -h dist/sb05
        echo "=== Testing executable ==="
        # Test in headless mode
        timeout 5s ./dist/sb05 --version 2>&1 | head -10 || echo "Executable test completed"

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: tv-server-executable
        path: srv/tv/dist/sb05
        retention-days: 30
name: Build TV Server

on:
  push:
    branches: [ tv-server-build, chered ]
  pull_request:
    branches: [ chered ]

jobs:
  build-tv-server:
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream8
      
    steps:
    - name: Use CentOS vault repositories
      run: |
        # Clean existing repos
        dnf clean all
        rm -rf /etc/yum.repos.d/*.repo
        
        # Use vault repositories for CentOS 8
        cat > /etc/yum.repos.d/centos.repo << 'EOF'
        [baseos]
        name=CentOS-8 - BaseOS
        baseurl=https://vault.centos.org/8.5.2111/BaseOS/x86_64/os/
        gpgcheck=1
        enabled=1
        gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-centosofficial

        [appstream]
        name=CentOS-8 - AppStream
        baseurl=https://vault.centos.org/8.5.2111/AppStream/x86_64/os/
        gpgcheck=1
        enabled=1
        gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-centosofficial

        [extras]
        name=CentOS-8 - Extras
        baseurl=https://vault.centos.org/8.5.2111/extras/x86_64/os/
        gpgcheck=1
        enabled=1
        gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-centosofficial

        [epel]
        name=Extra Packages for Enterprise Linux $releasever - $basearch
        baseurl=https://download.fedoraproject.org/pub/epel/8/Everything/x86_64
        enabled=1
        gpgcheck=1
        gpgkey=https://download.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-8
        EOF
        
        # Import GPG keys
        rpm --import https://www.centos.org/keys/RPM-GPG-KEY-CentOS-Official
        rpm --import https://download.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-8

    - name: Install system dependencies
      run: |
        dnf update -y --nogpgcheck
        dnf install -y python38 python38-pip python38-devel gcc gcc-c++ make \
        tk-devel bzip2-devel ncurses-devel libffi-devel readline-devel \
        sqlite-devel which wget git glibc-langpack-en
        
        # Install VLC from EPEL
        dnf install -y vlc vlc-devel vlc-core
        
        # Install PyInstaller
        pip3.8 install pyinstaller==6.14.2

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Python dependencies
      working-directory: ./srv/tv
      run: |
        pip3.8 install -r requirements1.txt

    - name: Build executable with PyInstaller
      working-directory: ./srv/tv
      run: |
        # Use the original build command with VLC data
        python3.8 -m PyInstaller sb05.py \
          --onefile \
          --hidden-import=logger \
          --hidden-import=sb05_ui \
          --hidden-import=sb05_vars \
          --hidden-import=date_time \
          --hidden-import=customtkinter \
          --hidden-import=tkinter \
          --hidden-import=vlc \
          --add-data='/usr/lib64/vlc:vlc/'

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: tv-server-executable
        path: srv/tv/dist/sb05
        retention-days: 30